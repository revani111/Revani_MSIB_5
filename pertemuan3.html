<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 3 - Tabel</title>
</head>
<body>
    <table border="1" width="50%" cellpadding="5" cellspacing="0">
        <caption>Daftar Belanja</caption>
        <thead>
            <tr bgcolor="pink">
                <td>No</td>
                <td>Nama Barang</td>
                <td>Unit</td>
                <td>Harga</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Sabun</td>
                <td>2</td>
                <td>Rp. 6000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Pasta Gigi</td>
                <td>1</td>
                <td>Rp. 7000</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Sampo</td>
                <td>1</td>
                <td>Rp. 7000</td>
            </tr>
        </tbody>
        <tfoot bgcolor="pink">
            <tr>
                <td colspan="3">Total Harga</td>
                <!-- <td></td>
                <td></td> -->
                <td>Rp. 20.000</td>
            </tr>
        </tfoot>

    </table>
</body>
</html>
